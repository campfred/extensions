name: newt
depends:
  - service: cri
  - network:
      - addresses
      - connectivity
      - etcfiles
      - hostname
  - configuration: true
container:
  entrypoint: /usr/local/bin/newt
  security:
    writeableRootfs: false
    writeableSysfs: true
  mounts:
  # Mount CA root certificates as the endpoints will be signed by Let's Encrypt
  - source: /etc/ssl/certs
    destination: /etc/ssl/certs
    type: bind
    options:
      - rbind
      - ro
  ## Newt state. Particularly its config.
  - source: /.config/newt-client/
    destination: /.config/newt-client/
    type: bind
    options:
      - bind
      - rw
restart: always
